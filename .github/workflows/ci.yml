# CI：Linux 跑跨平台 crate 与审计，Windows 跑全量编译与单测。
# 注意（C-TEST-04）：CI 宿主上禁止加载驱动、注册服务或修改网络设置；
# 需要这些的 e2e 测试只在虚拟机里跑（cargo xtask e2e）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: 跨平台 crate（Linux）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 锁定的工具链
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-llvm-cov
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo nextest run --workspace --no-tests=warn --no-fail-fast
      - name: 行覆盖率不低于 80%（C-TEST-01）
        run: |
          rustup component add llvm-tools-preview
          for p in procroute-rules procroute-config procroute-relay; do
            cargo llvm-cov nextest -p "$p" --fail-under-lines 80 --summary-only
          done
      - name: deny
        run: cargo deny check
      - name: 前端类型与 proto 一致（C-ARCH-04）
        run: cargo xtask gen-types --check

  windows:
    name: 全量（Windows）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 rust-toolchain.toml 锁定的工具链
        run: rustup show
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 拉取并校验锁定版本的 sing-box（C-DEP-04）
        run: cargo xtask fetch-deps
      - name: test
        run: cargo nextest run --workspace --no-tests=warn --no-fail-fast

  frontend:
    name: 前端
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
