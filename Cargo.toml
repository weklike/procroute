# SPDX-License-Identifier: GPL-3.0-or-later
[workspace]
resolver = "3"
members = [
    "app/src-tauri",
    "crates/config",
    "crates/core-mgr",
    "crates/intercept",
    "crates/platform-win",
    "crates/procwatch",
    "crates/proto",
    "crates/relay",
    "crates/rules",
    "crates/svc",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
