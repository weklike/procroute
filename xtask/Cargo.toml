# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "xtask"
description = "仓库自动化任务：cargo xtask <命令>"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
procroute-proto = { path = "../crates/proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# fetch-deps 用 Windows CNG 校验 SHA256（与服务校验 sing-box 用同一实现）。
[target.'cfg(windows)'.dependencies]
procroute-platform-win = { path = "../crates/platform-win" }

[lints]
workspace = true
