# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "procroute-core-mgr"
description = "sing-box 配置生成、子进程守护与控制 API 客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# 配置生成是纯函数，在任何平台上都能编译和测试；只有用锁定版本的 sing-box 做
# `sing-box check` 回归的测试需要 Windows。
[dependencies]
procroute-config = { path = "../config" }
procroute-platform-win = { path = "../platform-win" }
procroute-proto = { path = "../proto" }
procroute-rules = { path = "../rules" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
regex = "1.13.1"

[lints]
workspace = true
