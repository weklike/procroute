# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "procroute-platform-win"
description = "Windows API 封装：路径规范化、DPAPI、ACL、服务控制，以及跨平台的 Secret<T>"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
procroute-rules = { path = "../rules" }
thiserror = "2.0.21"

# Win32 API 用 windows-sys：tokio/mio 已经依赖同一版本，不额外引入第二个 Windows 绑定库（C-DEP-03）。
# 放在 cfg(windows) 下，保证本 crate 在 Linux CI 上仍可编译。
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    # WTHelper* 函数引用了编录与 SIP 结构体，需要这两个特性才会生成。
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
]

# 控制管道用 tokio 的命名管道实现（异步运行时统一 tokio，AGENTS 5.1）。
[target.'cfg(windows)'.dependencies.tokio]
version = "1.54.1"
features = ["net"]

[target.'cfg(windows)'.dev-dependencies.tokio]
version = "1.54.1"
features = ["net", "rt", "macros", "io-util"]

# 本 crate 是允许 `unsafe` 的两处之一（C-CODE-01）：crate 级别为 deny，只在需要调用
# Win32 API 的模块上用 `#![allow(unsafe_code)]` 局部放开，每个 unsafe 块必须带 SAFETY 注释。
# 其余 lint 与 workspace 保持一致。
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
undocumented_unsafe_blocks = "deny"
