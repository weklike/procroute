[package]
name = "procroute-relay"
description = "NAT 表、本地 TCP/UDP 中继与 SOCKS5 客户端"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
procroute-proto = { path = "../proto" }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "io-util", "rt", "time", "sync", "macros"] }

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }

[lints]
workspace = true
