# cargo-deny 配置。许可证白名单见 CONSTRAINTS C-DEP-02；白名单外的许可必须走例外 ADR。

[graph]
all-features = true
# 只审计实际分发的目标：安装包只有 Windows x64（C-DRV-05）；Linux 只在 CI 上编译测试跨平台 crate，
# 产物不分发。不限定时，Tauri 及其插件只在 Linux / macOS 上用到的 GTK、D-Bus 等依赖也会被算进来；
# 同时列出两个目标也不行：cargo-deny 对每条依赖边只要匹配任一目标就保留，会把「Windows 上才依赖
# 插件」和「插件在 Linux 上才依赖 zbus」拼在一起。
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# 白名单是政策，不要求每项都已出现
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
]

[licenses.private]
# 本仓库自己的 crate 都是 publish = false，不参与许可检查
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
